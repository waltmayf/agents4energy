# Fast, credential-free CDK synth gate for gateway-platform/ (issue #534 — the
# analog of `checks.yml`'s "CDK synth check (web)" step for the standalone
# gateway-platform app). Runs on any PR touching gateway-platform/** and
# blocks merge if the app doesn't scaffold/synth cleanly.
#
# Deliberately does NOT deploy or touch AWS: no OIDC, no secrets — just
# install + `npm run test:synth` (see gateway-platform/scripts/check-cdk-synth.mjs).
# Safe to run on untrusted PRs.
name: Gateway Platform Synth Check

on:
  pull_request:
    paths:
      - 'gateway-platform/**'
  workflow_dispatch:

concurrency:
  group: gateway-platform-synth-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  synth-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: gateway-platform
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: gateway-platform/package-lock.json

      - run: npm ci

      - name: CDK synth check (gateway-platform)
        run: npm run test:synth
