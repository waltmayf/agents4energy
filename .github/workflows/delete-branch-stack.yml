# Tears down a branch's per-branch Amplify sandbox stack when the branch goes
# away — so a merged/closed PR never leaks its sandbox (each sandbox holds a
# full AppSync GraphQL API, and the account has a hard 50-API/region limit).
#
# Triggers (belt-and-suspenders, because no single GitHub event covers every
# way a branch's work ends):
#   • pull_request: closed  — fires the moment a PR is merged OR closed, even if
#     the head branch is left undeleted (GitHub's "auto-delete head branches"
#     only deletes branches of *merged* PRs, never *closed* ones). This is the
#     primary trigger and covers "when the PR is merged or closed".
#   • delete (branch)       — fires on a manual/auto branch deletion that isn't
#     tied to a PR close (e.g. deleting an abandoned branch directly).
#   • workflow_dispatch     — manual re-run for a specific branch slug.
#
# The hosting resources (S3 + CloudFront) are a nested stack inside the sandbox
# root stack (see web/amplify/backend.ts's `backend.createStack('hosting')`),
# so deleting the root stack tears down hosting too — no separate CDK destroy
# or `ampx sandbox delete` needed. The hosting bucket has autoDeleteObjects
# enabled, so CloudFormation empties it automatically before deletion.
#
# Does NOT touch AgentCore (harness, gateway, memory). Those are deployed once to
# a single shared "default" target (agent/default/agentcore/aws-targets.json) —
# not per branch — so branch/PR teardown must never tear them down.
#
# NOTE: `pull_request` and `delete` events run the workflow definition from the
# repo's DEFAULT branch, so this only takes effect once merged to main.
name: Delete branch stack

on:
  pull_request:
    types: [closed]
  delete:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch name whose preview stack should be deleted'
        required: true

env:
  AWS_REGION: ${{ vars.AWS_REGION }}

concurrency:
  group: deploy-${{ github.event.pull_request.head.ref || github.event.ref || inputs.branch }}
  cancel-in-progress: false

jobs:
  delete-stack:
    # Run for: a manual dispatch, a branch-delete event, or a PR-close event —
    # but for PR close only from a same-repo head branch (fork PRs don't get
    # AWS secrets and never had a sandbox deployed for them).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'delete' && github.event.ref_type == 'branch') ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # required for OIDC auth to AWS
      contents: read

    steps:
      # The branch may no longer exist, so check out the default branch
      # (only needed to read web/package.json for the sandbox stack's app-name prefix).
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolve branch slug
        # RAW_BRANCH comes from untrusted event context (a branch name / PR head
        # ref / dispatch input can contain shell metacharacters), so it MUST be
        # passed via env and referenced as "$RAW_BRANCH" — never interpolated
        # into the script body.
        env:
          RAW_BRANCH: ${{ github.event.pull_request.head.ref || github.event.ref || inputs.branch }}
        run: |
          # Mirror scripts/build.sh's normalisation exactly, so this resolves to the
          # same --identifier the sandbox was deployed with: lowercase + dashes,
          # used verbatim when <= 14 chars (so `main` etc. keep their identifier),
          # else first 8 chars + '-' + first 5 hex chars of the full name's sha1
          # (14 chars total, under the ampx 15-char limit). See #400 — a blind
          # truncate-to-14 collided whenever two branches shared a 14-char prefix,
          # which can only happen for names > 14 chars.
          BRANCH_LOWER_DASHED=$(echo "$RAW_BRANCH" | tr '/' '-' | tr '[:upper:]' '[:lower:]')
          if [ "${#BRANCH_LOWER_DASHED}" -gt 14 ]; then
            BRANCH_HASH=$(printf '%s' "$BRANCH_LOWER_DASHED" | sha1sum | cut -c1-5)
            BRANCH_SLUG="$(printf '%s' "$BRANCH_LOWER_DASHED" | cut -c1-8)-$BRANCH_HASH"
          else
            BRANCH_SLUG="$BRANCH_LOWER_DASHED"
          fi
          # ampx strips hyphens from the identifier when naming the sandbox stack.
          BRANCH_SLUG_CLEAN=$(echo "$BRANCH_SLUG" | tr -d '-')
          PROJECT=$(node -p "require('./web/package.json').name")
          echo "BRANCH_SLUG_CLEAN=$BRANCH_SLUG_CLEAN" >> "$GITHUB_ENV"
          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"

      - name: Delete Amplify sandbox stack (fire-and-forget)
        run: |
          echo "::group::Find sandbox root stack for $BRANCH_SLUG_CLEAN"
          # Root stack pattern: amplify-<project>-<slug>-sandbox-<8hexchars>
          # (excludes nested stacks, which have additional trailing segments).
          STACK_NAME=$(aws cloudformation list-stacks \
            --stack-status-filter CREATE_COMPLETE UPDATE_COMPLETE UPDATE_ROLLBACK_COMPLETE ROLLBACK_COMPLETE \
            --query "StackSummaries[?starts_with(StackName, 'amplify-${PROJECT}-${BRANCH_SLUG_CLEAN}-sandbox-')].StackName" \
            --output text | tr '\t' '\n' | grep -E "^amplify-${PROJECT}-[^-]+-sandbox-[a-f0-9]+\$" | head -1)

          if [ -z "$STACK_NAME" ]; then
            echo "No sandbox stack found for branch slug $BRANCH_SLUG_CLEAN — nothing to delete"
          else
            echo "Deleting $STACK_NAME (not waiting for completion)…"
            aws cloudformation delete-stack --stack-name "$STACK_NAME"
          fi
          echo "::endgroup::"
