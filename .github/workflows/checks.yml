# Fast, credential-free PR gate (issue #135). Runs on every pull request and
# blocks merge when the code doesn't type-check or the unit tests fail — the
# class of defect that shipped in PR #134 (backend.ts failed `npx tsc --noEmit`
# with "used before declaration" errors, but nothing in CI caught it). Also runs
# a synth-only CDK check (issue #152) that catches circular stack dependencies
# and other synth-time CDK errors — the class of defect from PR #148, which
# type-checked cleanly but failed to deploy with
# "CloudformationStackCircularDependencyError: circular dependency found
# between nested stacks".
#
# Deliberately does NOT deploy or touch AWS: no OIDC, no secrets, just install +
# type-check + synth check + unit tests. Keep it that way so it stays fast and
# safe to run on untrusted PRs.
#
# Lint (`pnpm lint`) is intentionally NOT gated yet: `main` currently has a large
# backlog of pre-existing eslint errors (incl. eslint scanning generated output),
# so making it blocking would fail every PR. Clean that up separately, then add
# `pnpm lint` here as a required step.
#
# NOTE: per CLAUDE.md this repo can't push directly to .github/workflows/, so this
# lives in workflow-drafts/. A maintainer copies it to .github/workflows/checks.yml
# and (recommended) marks the `checks` job a required status check on `main`.
name: Checks

on:
  pull_request:
  workflow_dispatch:

# Cancel superseded runs for the same PR/branch — only the latest commit matters.
concurrency:
  group: checks-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      # Node 22, not 20: web's `test:unit` runs `node --test
      # --experimental-strip-types`, which needs Node 22.6+ (Node 20 errors with
      # "bad option: --experimental-strip-types").
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Parse-check the AgentCore runtime's hand-written ESM modules. `web`'s tsc
      # never sees these (they live under web/amplify/agentcore/, are plain .js and
      # excluded from the backend tsconfig, and are only ever parsed when the Docker
      # image boots), and nothing in CI builds that image —
      # so a syntax error here ships green and crashes every dispatch on boot with
      # a generic RuntimeClientError (issue #324: an unescaped quote in a server.js
      # prompt string; issue #310: a missing Dockerfile COPY). `node --check` is a
      # credential-free syntax-only parse, exactly the cheap guard that was missing.
      - name: Parse-check AgentCore runtime modules
        run: |
          for f in web/amplify/agentcore/ClaudeCode/*.js; do
            echo "node --check $f"
            node --check "$f"
          done

      # No amplify_outputs.json stub needed: web/amplify_outputs.d.ts declares the
      # `*/amplify_outputs.json` module ambiently, so tsc resolves the import with
      # the deploy-generated (gitignored) file absent. Removing the stub also means
      # the gate no longer masks a PR that wrongly commits that file (#146).
      # Type-check the web workspace (root has no tsconfig; all TS lives under web/).
      # This is the check that would have blocked PR #134.
      - name: Type check (web)
        run: cd web && npx tsc --noEmit

      # Synth-only CDK check (#152): dynamically imports amplify/backend.ts and
      # triggers the same 'amplifySynth' App.synth() call @aws-amplify/backend's
      # sandbox/pipeline-deploy use internally (see default_stack_factory.js) —
      # without ampx, which calls SSM:GetParameter to check CDK bootstrap status
      # *before* synth and so requires valid AWS credentials just to reach it.
      # App.synth() alone doesn't catch circular dependencies between nested
      # stacks (that's a CloudFormation deploy-time error, not a CDK synth-time
      # one), so the script also walks every generated template and checks it
      # for resource dependency cycles via aws-cdk-lib/assertions. No AWS calls,
      # no credentials — see web/scripts/check-cdk-synth.mjs for details.
      - name: CDK synth check (web)
        run: cd web && pnpm test:synth

      # Unit tests — node:test suite, no AWS/browser needed.
      - name: Unit tests (web)
        run: cd web && pnpm test:unit
